name: COMVERXA diagnostico publico de producao
# Validação da correção de sintaxe v8
on:
  push:
    paths:
      - .github/workflows/comverxa-live-diagnostic.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspecionar respostas publicas sem credenciais
        run: |
          node - <<'NODE'
          const base='https://app.comverxa.com.br';
          for(const path of ['/','/healthz','/api/me','/api/leads','/api/dashboard','/api/billing','/api/cvx-license','/cvx-ui.js']) {
            try {
              const response=await fetch(base+path,{redirect:'manual',signal:AbortSignal.timeout(12000)});
              const body=await response.text();
              const csp=response.headers.get('content-security-policy')||'';
              if(['/api/me','/api/leads','/api/dashboard','/api/billing','/api/cvx-license'].includes(path)){
                const passed=[401,403].includes(response.status);
                console.log('SECURITY_CHECK '+path+' '+response.status+' '+(passed?'PASS':'FAIL'));
                if(!passed)process.exitCode=1;
              }
              if(path==='/' && response.status===200){
                const script=body.split('<script id="comverxa-premium-v2-js">')[1]?.split('</script>')[0]||'';
                let syntax='missing';
                if(script){try{new Function(script);syntax='valid'}catch(e){syntax='invalid: '+String(e.message).slice(0,160)}}
                console.log('BILLING_SCRIPT_SYNTAX='+syntax);
                if(syntax!=='valid')process.exitCode=1;
              }
              console.log(JSON.stringify({
                path,status:response.status,type:response.headers.get('content-type'),
                bytes:Buffer.byteLength(body),
                contentSecurityPolicy:csp.slice(0,450),
                markers:{premium:body.includes('comverxa-premium-v2'),
                         uxScript:body.includes('cvx-ui.js'),billingV8:body.includes('cvx-billing-v8'),billingAddon:body.includes('cvxBillingAddon'),vip:body.includes('cvxVip'),
                         business:body.includes('Plano atual: business'),
                         title:body.includes('<title>')},
                scriptTags:(body.match(/<script/gi)||[]).length
              }));
            }catch(ex){console.log(JSON.stringify({path,error:String(ex.message).slice(0,160)}));process.exitCode=1;}
          }
          NODE
