name: COMVERXA - Diagnostico roteamento WhatsApp
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/whatsapp-routing-diagnostic.yml
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspecionar interface publica da caixa de entrada sem acessar dados de clientes
        run: |
          node <<'NODE'
          (async()=>{
          const res=await fetch('https://app.comverxa.com.br/',{signal:AbortSignal.timeout(20000)});
          const html=await res.text();
          console.log('HTTP '+res.status+' HTML_BYTES '+html.length);
          const queries=['Enviar resposta Meta API','Meta Cloud API não configurada','/api/inbox','/api/lines','sendMeta','sendEvolution','sendReply','replyText','replyBtn','chatSend','lineMode','evolution','Responder dentro do CRM','function editLead','function openLead','function renderLeads','function saveLead','function openThread','let selected','let leads','const lines','function updateLead','function switchTab'];
          for(const query of queries){
           const matches=[...html.matchAll(new RegExp(query.replace(/[.*+?^\${}()|[\]\\]/g,'\\$&'),'gi'))].slice(0,6);
           const context=matches.map(m=>{
             let a=Math.max(0,m.index-550),b=Math.min(html.length,m.index+800);
             return html.slice(a,b).replace(/\b(eyJ[A-Za-z0-9_-]{70,}|EAA[A-Za-z0-9]{50,})\b/g,'[redacted]');
           });
           console.log('MATCH '+JSON.stringify({query,count:matches.length,context}).slice(0,7500));
          }
          })().catch(e=>{console.log('DIAGNOSTIC_ERROR '+e.message);process.exit(1)});
          NODE
