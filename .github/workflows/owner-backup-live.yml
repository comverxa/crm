name: COMVERXA - Backup online sem credenciais
on:
  push:
    paths:
      - tests/owner-backup-live.mjs
      - .github/workflows/owner-backup-live.yml
  pull_request:
    paths:
      - tests/owner-backup-live.mjs
      - .github/workflows/owner-backup-live.yml
  workflow_dispatch:
jobs:
  live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar proteção e saúde do backup no domínio real
        run: node tests/owner-backup-live.mjs
