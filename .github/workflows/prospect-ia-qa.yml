name: COMVERXA Prospect IA QA
on:
  push:
    paths:
      - 'backend/prospect-ia-extension.js'
      - 'backend/prospect-dashboard.html'
      - 'tests/prospect-ia.test.mjs'
      - '.github/workflows/prospect-ia-qa.yml'
  pull_request:
    paths:
      - 'backend/prospect-ia-extension.js'
      - 'backend/prospect-dashboard.html'
      - 'tests/prospect-ia.test.mjs'
      - '.github/workflows/prospect-ia-qa.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check backend/prospect-ia-extension.js
      - run: node --test tests/prospect-ia.test.mjs
