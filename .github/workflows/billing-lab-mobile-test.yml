name: Testar seguranca de cobrancas no celular
on:
  push:
    paths:
      - backend/billing-lab-middleware.js
      - backend/billing-lab-ui.html
      - tests/billing-lab-auth.test.mjs
      - .github/workflows/billing-lab-mobile-test.yml
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Testar autenticacao, CSRF e simulacoes
        run: bun run tests/billing-lab-auth.test.mjs
