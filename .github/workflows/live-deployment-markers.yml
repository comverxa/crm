name: COMVERXA - Inspecao real dos marcadores do CRM
on:
  workflow_dispatch:
  push:
    paths:
      - tests/live-deployment-markers.mjs
      - .github/workflows/live-deployment-markers.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/live-deployment-markers.mjs
