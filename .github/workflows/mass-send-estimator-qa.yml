name: COMVERXA | Orçamento de disparos QA
on:
  push:
    paths:
      - backend/mass-send-cost-estimator.js
      - tests/mass-send-estimator-live.mjs
      - .github/workflows/mass-send-estimator-qa.yml
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Instalar controlador de navegador
        run: npm install --no-save playwright-core@1.56.1
      - name: Verificar simulador sem envios, cobranças ou escrita em produção
        run: node tests/mass-send-estimator-live.mjs
