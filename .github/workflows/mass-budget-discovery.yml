name: COMVERXA | Diagnosticar orçamento de campanhas
on:
  push:
    paths:
      - tests/mass-budget-discovery.mjs
      - .github/workflows/mass-budget-discovery.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright-core@1.56.1
      - run: node tests/mass-budget-discovery.mjs