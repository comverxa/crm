name: COMVERXA Desktop Layout Diagnostic
on:
  push:
    paths:
      - .github/workflows/desktop-layout-diagnostic.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.56.1
      - name: Analyze live app layout without customer data
        run: |
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
           const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
           try{
            for(const w of [390,960,1365,1440]){
             const page=await browser.newPage({viewport:{width:w,height:900}});
             const resp=await page.goto('https://app.comverxa.com.br/',{waitUntil:'domcontentloaded',timeout:30000});
             await page.evaluate(()=>{
              document.querySelector('#marketing')?.classList.add('hide');
              document.querySelector('#app')?.classList.remove('hide');
              document.querySelectorAll('#app .screen').forEach(e=>e.classList.add('hide'));
              document.querySelector('#dashboard')?.classList.remove('hide');
              document.querySelector('#dashboardStats').innerHTML=[['Leads cadastrados','1'],['Negociações','0'],['Vendas ganhas','0'],['Follow-ups vencidos','0']].map(([t,v])=>'<div class="stat"><small>'+t+'</small><b>'+v+'</b></div>').join('');
             });
             const d=await page.evaluate(()=>{
              const r=e=>{let x=e.getBoundingClientRect();let z=getComputedStyle(e);return {tag:e.tagName,id:e.id,cls:String(e.className).slice(0,140),rect:[Math.round(x.x),Math.round(x.y),Math.round(x.width),Math.round(x.height)],position:z.position,display:z.display,marginLeft:z.marginLeft,transform:z.transform,gridColumns:z.gridTemplateColumns,paddingLeft:z.paddingLeft}};
              const nodes=['#app','#app header.top','#app main','#dashboard','#dashboardStats','#dashboardStats .stat','#app nav.tabs','aside','#app > div','.sidebar','#comverxa-sidebar'].map(q=>[q,document.querySelector(q)]).filter(z=>z[1]).map(([q,e])=>({q,...r(e)}));
              const extra=[...document.querySelectorAll('#app *')].filter(e=>{const x=e.getBoundingClientRect(),s=getComputedStyle(e);return s.position==='fixed'&&x.width>100&&x.height>100}).slice(0,12).map(r);
              const styles=[...document.querySelectorAll('style')].map(e=>({id:e.id,length:e.textContent.length,sidebarTokens:(e.textContent.match(/.{0,130}(nav.tabs|sidebar|railway|aside|margin-left|padding-left|::before|:before|@media).{0,230}/gi)||[]).slice(0,35)}));
              const card=document.querySelector('#dashboardStats .stat');const rect=card?.getBoundingClientRect();const center=rect?document.elementFromPoint(Math.max(0,rect.x+30),Math.max(0,rect.y+25)):null;
              return {scrollWidth:document.documentElement.scrollWidth,viewport:innerWidth,nodes,extra,cardVisibleAtPoint:center?{tag:center.tagName,id:center.id,cls:String(center.className).slice(0,100),text:center.textContent.slice(0,60)}:null,styles};
             });
             console.log('DESKTOP_LAYOUT '+JSON.stringify({status:resp.status(),w,...d}));
             const html=await resp.text();
             console.log('LIVE_HTML_DIAGNOSTIC '+JSON.stringify({w,status:resp.status(),contentType:resp.headers()['content-type'],bytes:html.length,idAppDouble:html.includes('id="app"'),idAppSingle:html.includes("id='app'"),fix:html.includes('cvx-desktop-layout-hotfix'),premium:html.includes('comverxa-premium-v2'),headEnd:html.includes('</head>')}));
             const publishedCss=await page.locator('#cvx-desktop-layout-hotfix').count();
             if(publishedCss!==1)throw new Error('CRM production desktop hotfix not published');
             const fixed=await page.evaluate(()=>{
               document.querySelector('#marketing')?.classList.add('hide');
               document.querySelector('#app')?.classList.remove('hide');
               document.querySelectorAll('#app .screen').forEach(el=>el.classList.add('hide'));
               document.querySelector('#dashboard')?.classList.remove('hide');
               const stats=document.querySelector('#dashboardStats');if(stats)stats.innerHTML=[['Leads cadastrados','1'],['Negociações','0'],['Vendas ganhas','0'],['Follow-ups vencidos','0']].map(([a,b])=>'<div class="stat"><small>'+a+'</small><b>'+b+'</b></div>').join('');
               const rect=s=>{const el=document.querySelector(s);if(!el)return null;const r=el.getBoundingClientRect();return {x:r.x,y:r.y,right:r.right,width:r.width,height:r.height}};
               const card=document.querySelector('#dashboardStats .stat');const r=card?.getBoundingClientRect();
               const at=r?document.elementFromPoint(r.x+30,r.y+30):null;
               return {nav:rect('#app nav.tabs'),firstMenu:rect('#app nav.tabs > button'),main:rect('#app main'),header:rect('#app header.top'),card:rect('#dashboardStats .stat'),documentWidth:document.documentElement.scrollWidth,visibleFirstCard:!!(at&&card?.contains(at))};
             });
             console.log('FIXED_LAYOUT '+JSON.stringify({w,...fixed}));
             const assert=require('node:assert/strict');
             assert.ok(fixed.documentWidth<=w+2,'Page overflow at '+w);
             assert.ok(fixed.visibleFirstCard,'First stat blocked at '+w);
             if(w>=1101){
               assert.ok(fixed.nav.width===252,'Sidebar width wrong');
               assert.ok(fixed.main.x>=252,'Main section remains behind sidebar');
               assert.ok(fixed.card.x>=252,'Dashboard card remains behind sidebar');
               assert.ok(fixed.firstMenu.y>=100,'First navigation item overlaps COMVERXA logo');
               assert.ok(fixed.main.right<=w+2,'Main panel runs off screen');
             }else{
               assert.ok(fixed.main.x<30,'Non-desktop content moved incorrectly');
             }
             await page.close();
            }
           }finally{await browser.close()}
          })().catch(e=>{console.error('FATAL',e);process.exit(1)});
          NODE
