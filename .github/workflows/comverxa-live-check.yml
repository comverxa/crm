name: COMVERXA - prontidao operacional 19-10
on:
  push:
    branches:
      - feature/whatsapp-audio-imagem
    paths:
      - '.github/workflows/comverxa-live-check.yml'
      - 'tests/commercial-readiness.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificacao publica de producao - somente leitura
        run: node tests/commercial-readiness.mjs
