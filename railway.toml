# Configuration scoped to branch feature/comverxa-premium-comercial-v1.
# This branch is used ONLY for the isolated COMVERXA Commercial pilot.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.commercial"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
